name: CI/CD Pipeline with Docker and Self-Hosted Runner

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Uses public GitHub cloud instances to process image builds
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted # Tells GitHub to process this specific job inside your EC2 runner
    steps:
      - name: Pull Latest Docker Image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest

      - name: Stop and Remove Old Container
        run: |
          docker stop my-running-app || true
          docker rm my-running-app || true

      - name: Run New Containerized Application
        run: |
          docker run -d \
            --name my-running-app \
            -p 80:8000 \
            --restart always \
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
