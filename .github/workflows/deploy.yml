name: CI/CD Pipeline with Docker and Self-Hosted Runner

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    # This matches the exact multi-labels your runner spit out during setup!
    runs-on: [self-hosted, linux, x64] 
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Deploy Complete Stack via Docker Compose
        run: |
          sudo docker compose down --remove-orphans
          sudo docker compose up -d --build
